name: Pruebas

# En cada pull request y en cada cambio en main:
#   - app: tipos, tests de cálculo y compilación;
#   - base de datos: aplica las migraciones en un PostgreSQL desechable y comprueba
#     privacidad entre cuentas, cuenta compartida, aportaciones y borrados.
# No usa ningún secreto ni toca la base de datos de Supabase.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compilar
        run: npm run build

  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones y reglas de la base de datos
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/ejecutar.sh
