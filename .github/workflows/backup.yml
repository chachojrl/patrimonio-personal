name: Copia de seguridad semanal (y mantener Supabase activo)

# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Este workflow hace una petición cada semana (lo mantiene activo) y guarda una copia
# CIFRADA de todos los datos como artefacto del workflow (90 días).
# Secretos necesarios (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_URL (la «Project URL»: https://xxxx.supabase.co), SUPABASE_SERVICE_ROLE_KEY (la clave «service_role»),
#   BACKUP_PASSPHRASE (la contraseña con la que se cifra la copia)

on:
  schedule:
    - cron: '17 4 * * 1' # lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$PASS" ]; then
            echo "::warning::Faltan secretos; no se hace la copia."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Descargar datos
        if: steps.check.outputs.ok == 'true'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # La URL del proyecto sin barra final ni «/rest/v1» (por si el secreto los lleva)
          URL="${URL%%[[:space:]]}"; URL="${URL%/}"; URL="${URL%/rest/v1}"; URL="${URL%/}"
          case "$URL" in https://*) ;; *) echo "::error::SUPABASE_URL tiene que empezar por https:// (la «Project URL» de Supabase → Project Settings → API)."; exit 1 ;; esac
          # Primero, comprobar que la URL y la clave valen
          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' "$URL/rest/v1/config?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
          if [ "$codigo" != 200 ]; then
            motivo=$(jq -r '.message // .msg // .error // empty' respuesta.json 2>/dev/null || true)
            case "$codigo" in
              000) echo "::error::No se puede conectar con SUPABASE_URL. ¿Está bien escrita? ¿El proyecto está pausado?" ;;
              401|403) echo "::error::Supabase rechaza la clave ($codigo). SUPABASE_SERVICE_ROLE_KEY tiene que ser la «service_role» (Project Settings → API), no la «anon». ${motivo}" ;;
              404) echo "::error::Supabase responde 404. SUPABASE_URL tiene que ser la «Project URL» (https://xxxx.supabase.co), sin nada detrás. ${motivo}" ;;
              *) echo "::error::Supabase responde $codigo. ${motivo}" ;;
            esac
            exit 1
          fi
          rm -f respuesta.json
          mkdir -p copia
          # Supabase devuelve como máximo 1.000 filas por petición: se descarga por páginas
          for t in config months incomes expenses expense_entries savings debts cuentas cuenta_miembros lista_compra viajes viaje_gastos huchas hucha_movimientos cambios; do
            echo "[]" > "copia/$t.json"
            offset=0
            clave=id; [ "$t" = config ] && clave=user_id
            while :; do
              codigo=$(curl -sS -o pagina.json -w '%{http_code}' "$URL/rest/v1/$t?select=*&order=$clave.asc&limit=1000&offset=$offset" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
              if [ "$codigo" != 200 ]; then
                # Las tablas que llegan con migraciones posteriores pueden no existir aún: se sigue sin ellas
                case "$t" in debts|cuentas|cuenta_miembros|lista_compra|viajes|viaje_gastos|huchas|hucha_movimientos|cambios) ;;
                  *) echo "::error::No se pudo leer la tabla $t ($codigo): $(jq -r '.message // empty' pagina.json 2>/dev/null || true)"; exit 1 ;;
                esac
                echo "::warning::No se pudo leer la tabla $t ($codigo); ¿falta ejecutar la migración que la crea?"
                echo "[]" > pagina.json
              fi
              n=$(jq length pagina.json)
              jq -s '.[0] + .[1]' "copia/$t.json" pagina.json > tmp.json && mv tmp.json "copia/$t.json"
              [ "$n" -lt 1000 ] && break
              offset=$((offset + 1000))
            done
            rm -f pagina.json
            echo "$t: $(jq length "copia/$t.json") filas"
          done
      - name: Cifrar
        if: steps.check.outputs.ok == 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          tar czf copia.tgz copia
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o copia.tgz.gpg copia.tgz
          rm -rf copia copia.tgz
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: copia-presupuesto-${{ github.run_id }}
          path: copia.tgz.gpg
          retention-days: 90
