name: Copia de seguridad mensual (y mantener Supabase activo)

# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Este workflow se ejecuta cada lunes:
#   - todos los lunes hace una consulta mínima a Supabase (lo mantiene activo, no guarda nada);
#   - el primer lunes de cada mes (o al lanzarlo a mano) guarda además una copia CIFRADA de
#     todos los datos como artefacto del workflow, que GitHub borra a los 90 días
#     (así hay como mucho 3 copias; cada una ocupa unos pocos KB).
# Secretos necesarios (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BACKUP_PASSPHRASE

on:
  schedule:
    - cron: '17 4 * * 1' # lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$PASS" ]; then
            echo "::warning::Faltan secretos; no se hace la copia."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: ¿Toca copia este lunes?
        id: toca
        if: steps.check.outputs.ok == 'true'
        run: |
          # Primer lunes del mes (día 1-7) o ejecución manual
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "copia=true" >> "$GITHUB_OUTPUT"
          else
            echo "copia=false" >> "$GITHUB_OUTPUT"
            echo "Hoy solo se mantiene Supabase activo; la copia se hace el primer lunes de cada mes."
          fi
      - name: Mantener Supabase activo
        if: steps.check.outputs.ok == 'true' && steps.toca.outputs.copia == 'false'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sSf "$URL/rest/v1/months?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase responde."
      - name: Descargar datos
        if: steps.toca.outputs.copia == 'true'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p copia
          # Supabase devuelve como máximo 1.000 filas por petición: se descarga por páginas
          for t in config months incomes expenses expense_entries savings debts cuentas cuenta_miembros; do
            echo "[]" > "copia/$t.json"
            offset=0
            clave=id; [ "$t" = config ] && clave=user_id
            while :; do
              if ! curl -sSf "$URL/rest/v1/$t?select=*&order=$clave.asc&limit=1000&offset=$offset" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > pagina.json; then
                # debts (0004) y cuentas (0005) llegan con migraciones: si aún no existen, se sigue sin ellas
                case "$t" in debts|cuentas|cuenta_miembros) ;; *) exit 1 ;; esac
                echo "::warning::No existe la tabla $t (ejecuta la migración que la crea)."
                echo "[]" > pagina.json
              fi
              n=$(jq length pagina.json)
              jq -s '.[0] + .[1]' "copia/$t.json" pagina.json > tmp.json && mv tmp.json "copia/$t.json"
              [ "$n" -lt 1000 ] && break
              offset=$((offset + 1000))
            done
            rm -f pagina.json
            echo "$t: $(jq length "copia/$t.json") filas"
          done
      - name: Cifrar
        if: steps.toca.outputs.copia == 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          tar czf copia.tgz copia
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o copia.tgz.gpg copia.tgz
          rm -rf copia copia.tgz
      - uses: actions/upload-artifact@v4
        if: steps.toca.outputs.copia == 'true'
        with:
          name: copia-presupuesto-${{ github.run_id }}
          path: copia.tgz.gpg
          retention-days: 90
