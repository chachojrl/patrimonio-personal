<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Fondo y pantalla de carga antes de que arranque la app (sin destello blanco en modo oscuro) -->
    <style>
      html { background: #f2f2f7; }
      html.dark { background: #000; }
      .arranque { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .arranque img { width: 72px; height: 72px; border-radius: 16px; }
    </style>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Presupuesto personal</title>
    <script>
      try {
        var t = localStorage.getItem('tema');
        if (t === 'oscuro' || (t !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
        }
        var a = JSON.parse(localStorage.getItem('presupuesto-preferencias') || '{}').acento;
        if (a === 'verde' || a === 'grafito' || a === 'ciruela' || a === 'teja') document.documentElement.dataset.acento = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="arranque"><img src="icon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
